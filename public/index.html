<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ludoteca</title>
  <meta name="description" content="Nuestra colección de juegos de mesa, al estilo Pokédex.">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Aplica el tema antes de pintar para evitar parpadeo
    (function () {
      var t = null;
      try { t = localStorage.getItem('ludoteca-tema'); } catch (e) {}
      if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  <header class="dex-top">
    <div class="dex-top__inner">
      <a href="#/" class="dex-brand" aria-label="Ir al inicio">
        <span class="lens" aria-hidden="true"><span class="lens__shine"></span></span>
        <span class="leds" aria-hidden="true"><i class="led led--r"></i><i class="led led--y"></i><i class="led led--g"></i></span>
        <span class="dex-brand__text">
          <span class="dex-brand__title">Ludoteca</span>
          <span class="dex-brand__sub" id="contador">Juegos de mesa</span>
        </span>
      </a>
      <button class="theme-btn" id="themeBtn" type="button" aria-label="Cambiar tema">
        <svg class="ico-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
        <svg class="ico-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>
      </button>
    </div>
    <div class="dex-hinge" aria-hidden="true"></div>
  </header>

  <main id="app" class="wrap"></main>

  <footer class="foot wrap">
    <p>Ludoteca · Hecho con cariño para nuestras tardes de juego.</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
